<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>桌面提醒</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">✓</span>
        <div>
          <strong>桌面提醒</strong>
          <span>安静地记住每件事</span>
        </div>
      </div>

      <nav class="nav" aria-label="主导航">
        <button class="nav-item active" data-view="tasks" type="button">
          <span aria-hidden="true">☷</span>
          任务列表
        </button>
        <button class="nav-item" data-view="history" type="button">
          <span aria-hidden="true">▣</span>
          日期记录
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="quiet-note">
          <span class="quiet-dot"></span>
          <div><strong>静音通知</strong><span>关闭窗口后仍在托盘运行</span></div>
        </div>
        <button id="settings-button" class="text-button" type="button">打开 Windows 通知设置</button>
      </div>
    </aside>

    <main class="content">
      <header class="page-header">
        <div>
          <h1 id="page-title">任务列表</h1>
          <p id="page-subtitle">安排循环任务和定时任务，到点后持续提醒</p>
        </div>
        <button id="new-task-button" class="primary-button" type="button">
          <span aria-hidden="true">＋</span> 新建任务
        </button>
      </header>

      <section id="warning-banner" class="warning-banner hidden" role="status"></section>

      <section id="tasks-view" class="view-panel">
        <div class="summary-grid">
          <article class="summary-card">
            <span class="summary-label">运行中</span>
            <strong id="active-count">0</strong>
            <span class="summary-foot"><i class="dot green"></i> 正在等待提醒</span>
          </article>
          <article class="summary-card attention">
            <span class="summary-label">待完成</span>
            <strong id="waiting-count">0</strong>
            <span class="summary-foot"><i class="dot orange"></i> 会继续间隔提醒</span>
          </article>
          <article class="summary-card">
            <span class="summary-label">全部任务</span>
            <strong id="total-count">0</strong>
            <span class="summary-foot"><i class="dot blue"></i> 配置自动保存</span>
          </article>
        </div>

        <div class="list-toolbar">
          <div class="filter-group" role="group" aria-label="筛选任务">
            <button class="filter-button active" data-filter="all" type="button">全部</button>
            <button class="filter-button" data-filter="interval" type="button">循环</button>
            <button class="filter-button" data-filter="scheduled" type="button">定时</button>
            <button class="filter-button" data-filter="awaiting" type="button">待完成</button>
            <button class="filter-button" data-filter="completed" type="button">已完成</button>
          </div>
          <label class="search-box">
            <span aria-hidden="true">⌕</span>
            <input id="task-search" type="search" placeholder="搜索任务" autocomplete="off" />
          </label>
        </div>

        <div id="task-list" class="task-list" aria-live="polite"></div>
        <div id="task-empty" class="empty-state hidden">
          <span class="empty-icon" aria-hidden="true">✓</span>
          <h2>这里还没有任务</h2>
          <p>新建一个循环或定时任务，提醒会在后台安静运行。</p>
          <button class="secondary-button create-empty" type="button">新建第一个任务</button>
        </div>
      </section>

      <section id="history-view" class="view-panel hidden">
        <div class="date-toolbar">
          <button id="previous-day" class="icon-button" type="button" aria-label="前一天">‹</button>
          <label class="date-picker-wrap">
            <span>查看日期</span>
            <input id="history-date" type="date" />
          </label>
          <button id="next-day" class="icon-button" type="button" aria-label="后一天">›</button>
          <button id="today-button" class="secondary-button compact" type="button">回到今天</button>
        </div>

        <div class="history-summary">
          <div><span>当日任务</span><strong id="day-total">0</strong></div>
          <div><span>已完成</span><strong id="day-completed" class="success-text">0</strong></div>
          <div><span>未完成</span><strong id="day-pending" class="warning-text">0</strong></div>
          <div class="completion-progress" aria-label="完成进度">
            <div><span>完成进度</span><b id="day-percent">0%</b></div>
            <div class="progress-track"><i id="day-progress"></i></div>
          </div>
        </div>

        <div id="history-list" class="history-list" aria-live="polite"></div>
        <div id="history-empty" class="empty-state hidden">
          <span class="empty-icon calendar" aria-hidden="true">▣</span>
          <h2>这一天没有任务</h2>
          <p>切换日期查看其他记录，或返回任务列表新建任务。</p>
        </div>
      </section>
    </main>
  </div>

  <div id="task-modal" class="modal-backdrop hidden" role="presentation">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-header">
        <div>
          <span class="eyebrow" id="modal-eyebrow">创建提醒</span>
          <h2 id="modal-title">新建任务</h2>
        </div>
        <button id="close-modal" class="modal-close" type="button" aria-label="关闭">×</button>
      </header>

      <form id="task-form" novalidate>
        <input id="task-id" type="hidden" />
        <div class="form-grid">
          <label class="field full">
            <span>任务名称</span>
            <input id="task-name" maxlength="80" placeholder="例如：提交日报" required />
          </label>
          <label class="field full">
            <span>提醒内容</span>
            <textarea id="task-content" maxlength="500" rows="3" placeholder="收到提醒时希望看到的内容" required></textarea>
            <small><b id="content-count">0</b>/500</small>
          </label>
        </div>

        <fieldset class="form-section">
          <legend>任务类型</legend>
          <div class="choice-grid two">
            <label class="choice-card">
              <input type="radio" name="task-kind" value="interval" checked />
              <span><b>循环任务</b><small>按固定分钟间隔重复提醒</small></span>
            </label>
            <label class="choice-card">
              <input type="radio" name="task-kind" value="scheduled" />
              <span><b>定时任务</b><small>每天或指定日期准时提醒</small></span>
            </label>
          </div>
        </fieldset>

        <div id="interval-fields" class="form-section field-panel">
          <label class="field">
            <span>循环间隔</span>
            <div class="unit-input"><input id="interval-minutes" type="number" min="1" max="10080" value="30" required /><em>分钟</em></div>
          </label>
          <p class="field-help">启用后开始倒计时；首次提醒后仍按此间隔提醒，直到点击完成。</p>
        </div>

        <div id="scheduled-fields" class="form-section field-panel hidden">
          <div class="schedule-mode-row">
            <label><input type="radio" name="schedule-mode" value="daily" checked /> 每日某时</label>
            <label><input type="radio" name="schedule-mode" value="once" /> 指定日期</label>
          </div>
          <div class="form-grid scheduled-grid">
            <label id="daily-time-field" class="field">
              <span>每天执行时间</span>
              <input id="daily-time" type="time" step="1" value="09:00:00" />
            </label>
            <label id="once-time-field" class="field hidden">
              <span>执行日期和时间</span>
              <input id="once-at" type="datetime-local" step="1" />
            </label>
            <label class="field">
              <span>未完成时再次提醒</span>
              <div class="unit-input"><input id="repeat-minutes" type="number" min="1" max="10080" value="10" /><em>分钟</em></div>
            </label>
          </div>
          <p class="field-help">到点后会按再次提醒间隔持续通知，点击“完成”后才停止。每日任务完成后自动等待次日。</p>
        </div>

        <label class="switch-row">
          <span><b>保存后启用</b><small>关闭时仅保存任务，不开始计时</small></span>
          <input id="task-active" type="checkbox" checked />
          <i aria-hidden="true"></i>
        </label>

        <p id="form-error" class="form-error hidden" role="alert"></p>
        <footer class="modal-footer">
          <button id="cancel-modal" class="secondary-button" type="button">取消</button>
          <button id="save-task" class="primary-button" type="submit">保存任务</button>
        </footer>
      </form>
    </section>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
